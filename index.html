<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CineFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>CineFlow</h1>

    <video id="video" controls width="800"></video>

<div class="controls">
    <button onclick="setQuality('360')">360p</button>
    <button onclick="setQuality('720')">720p</button>
    <button onclick="setQuality('1080')">1080p</button>
</div>

<input type="file" id="fileInput" accept="video/mp4">

        <button onclick="backward()">⏪</button>
        <button onclick="playPause()">▶ / ⏸</button>
        <button onclick="forward()">⏩</button>

        <button onclick="volDown()">🔉-</button>
        <button onclick="volUp()">🔊+</button>

        <button onclick="brightDown()">☀-</button>
        <button onclick="brightUp()">☀+</button>
        <button onclick="fullScreen()">Fullscreen</button>

    </div>
    

    <br>

    <input type="file" id="fileInput" accept="video/*">

</div>

<script src="script.js"></script>

</body>
</html>
