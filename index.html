<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MEDIA PLAYER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash">
    <h1 class="logo">MEDIA PLAYER</h1>
</div>

<div id="app" style="display:none;">
    <!-- your normal MEDIA PLAYER UI here -->
</div>

<div class="container">

    <h1>MEDIA PLAYER</h1>

    <video id="video" width="1000" height="1000" controls></video>
   <audio id="introSound">
    <source src="https://example.com/intro.mp3" type="audio/mpeg">
</audio>

    <div class="controls">

        <button onclick="backward()">⏪</button>
        <button onclick="playPause()">▶ / ⏸</button>
        <button onclick="forward()">⏩</button>

        <button onclick="volDown()">🔉-</button>
        <button onclick="volUp()">🔊+</button>

        <button onclick="brightDown()">☀-</button>
        <button onclick="brightUp()">☀+</button>

    </div>
    

    <br>

    <input type="file" id="fileInput" accept="video/*">

</div>


<script src="script.js"></script>

</body>
</html>
